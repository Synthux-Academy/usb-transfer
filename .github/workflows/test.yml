name: Tests

# cpp/usb_transfer built for the host with a test device, with js/ run against it,
# so both sides of the protocol stay in sync.
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test/run.sh
